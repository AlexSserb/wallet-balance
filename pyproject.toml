[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallet-balance"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
    "ty>=0.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: ошибки стиля
    "W",    # pycodestyle: предупреждения
    "F",    # pyflakes: неиспользуемые импорты/переменные
    "I",    # isort: порядок импортов
    "UP",   # pyupgrade: современный синтаксис Python 3.13
    "B",    # bugbear: типичные баги и антипаттерны
    "SIM",  # simplify: упрощение условий и блоков
    "RUF",  # ruff-specific: правила самого ruff
    "D",    # pydocstyle: обязательные docstrings
    "ANN",  # annotations: обязательные type hints
    "N",    # pep8-naming: соглашения об именовании
    "C4",   # flake8-comprehensions: оптимальные comprehensions
    "PTH",  # flake8-use-pathlib: pathlib вместо os.path
    "ERA",  # eradicate: запрет закомментированного кода
]
ignore = [
    "D203",  # конфликтует с D211 (нет пустой строки перед docstring класса)
    "D213",  # конфликтует с D212 (summary на первой строке multi-line docstring)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",    # аннотации в тестах опциональны
    "D103",   # docstring для тест-функций не обязателен
    "S101",   # assert в тестах ожидаем
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"